<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration</title>
</head>
<body>
    <h2>Student Registration</h2>
    <form action="">

        <label for="name">Roll No:    </label>
        <input type="text" id="name" name="name"><br><br>
        <label for="name">First Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="name">Last Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label>Age:</label>
        <input type="number" min="15" max="40">
        <br><br>
        <label for="name">Father Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="name">Date of Birth:</label>
        <input type="date" id="name" name="name"><br><br>
        <label for="name">Phone Number:</label>
        <input type="tel" id="name" name="name"><br><br>
        <label for="name">Email:</label>
        <input type="email" id="name" name="name"><br><br>
        
        <label>Gender:</label>
        <input type="radio" name="gender" value="Male">
        <label>Male</label>
        <input type="radio" name="gender" value="Female">
        <label>Female</label>
        <input type="radio" name="gender" value="Other">
        <label>Other</label><br><br>

        <label for="name">Department:</label>
        <input type="checkbox" id="name" name="name"> CSE  
        <input type="checkbox" id="name" name="name"> IT 
        <input type="checkbox" id="name" name="name"> ECE 
        <input type="checkbox" id="name" name="name"> EEE <br><br>

        <label>Programming Knowledge:</label>
        <input type="range" min="0" max="10">
        <br><br>

        <label>Favorite Color:</label>
        <input type="color">
        <br><br>

        <label for="name">Student photo:</label>
        <input type="file" id="name" name="name"><br><br>
        
        <label>Admission Date & Time:</label>
        <input type="datetime-local">
        <br><br>

        
        <label>Joining Month:</label>
        <input type="month">
        <br><br>

        
        <label>Joining Week:</label>
        <input type="week">
        <br><br>
        
        <label>Portflio URL:</label>
        <input type="url" >
        <br><br>

        <input type="submit" value="Submit"> 

        <input type="reset" value="reset"> 
        

    </form>
</body>
</html>
